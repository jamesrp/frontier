<style>/* Layout: an old-school game window. Gray beveled chrome, a navy title strip, black LCD readouts, chunky pixel art in the stage.
   Top bar of resources, a big stage (map / city / battle), a side panel of cards that stacks under it on narrow screens. */
:root {
  --desk: #1c2a24;       /* page ground behind the window */
  --chrome: #b9b4a6;     /* window gray */
  --chrome-hi: #ecE8dc;  /* bevel light */
  --chrome-lo: #6d695e;  /* bevel shadow */
  --chrome-dk: #2a2822;  /* outer edge */
  --title: #1d2f6b;      /* title strip */
  --title-2: #3b5bb0;
  --lcd: #0a0d0b;        /* readouts */
  --deck: #141a26;       /* side panel ground */
  --deck-2: #1f2738;     /* cards */
  --line: #3a465e;
  --ink: #eef1e6;
  --ink-dim: #a8b3bf;
  --ink-chrome: #1a1914; /* text on gray */
  --sun: #ffd84a;
  --mint: #7cf08f;
  --ember: #ff6b5b;
  --sky: #7ee0ff;
  --f-pixel: "FrontierPx", "Courier New", monospace;
  --f-body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --bevel-out: inset 2px 2px 0 var(--chrome-hi), inset -2px -2px 0 var(--chrome-lo);
  --bevel-in: inset 2px 2px 0 var(--chrome-lo), inset -2px -2px 0 var(--chrome-hi);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-synthesis: none; background: var(--desk); color: var(--ink); font: 15px/1.45 var(--f-body);
  background-image: radial-gradient(#2c3d33 1px, transparent 1px); background-size: 6px 6px; }
#app { min-height: 100%; display: flex; flex-direction: column;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 8px 16px; gap: 8px; }
@media (max-width: 600px) { #app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
h1, h2, h3 { font-family: var(--f-pixel); font-weight: 600; line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-size: 1.45rem; color: var(--sun); }
h3 { font-size: 1.1rem; color: var(--ink-dim); margin-top: 6px; }
p { margin: 0; }
b { font-weight: 700; }
small { color: var(--ink-dim); font-size: .78em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px dotted var(--sun); outline-offset: 2px; }

/* ---------- pixel icons */
.pi, .pu, .pb { image-rendering: pixelated; vertical-align: middle; }
.pi { width: 20px; height: 20px; }
.pu { height: 30px; width: auto; }
.pb { height: 44px; width: auto; }
.chip .pi { width: 16px; height: 16px; }
.chip .pu { height: 20px; }
.stk { display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; font-family: var(--f-pixel); }
.px { image-rendering: pixelated; }

/* ---------- buttons and chips: raised gray keys */
.btn { cursor: pointer; border: 2px solid var(--chrome-dk); background: var(--chrome); color: var(--ink-chrome); padding: 7px 14px; border-radius: 0;
  box-shadow: var(--bevel-out); font-family: var(--f-pixel); font-weight: 600; font-size: 1rem; line-height: 1.1;
  display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.btn:hover:not(:disabled) { background: #cdc8b9; }
.btn:active:not(:disabled) { box-shadow: var(--bevel-in); transform: translate(1px, 1px); }
.btn:disabled { color: #7a766b; cursor: not-allowed; text-shadow: 1px 1px 0 var(--chrome-hi); }
.btn.ghost { background: var(--chrome); }
.btn.ghost small { color: #4a473f; }
.btn.end { background: #e2b31f; color: #241a00; }
.btn.end:hover:not(:disabled) { background: #f2c63a; }
.btn.small { padding: 4px 10px; font-size: .9rem; }
.chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; background: var(--lcd); border: 1px solid #3c4a3f;
  font-family: var(--f-pixel); font-size: .88rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.lack { border-color: var(--ember); color: #ffb3a8; }
.chip.undo { cursor: pointer; }
.dim { color: var(--ink-dim); }
.warn { color: var(--sun); }
.gold { color: var(--sun); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row.between { justify-content: space-between; }
.row.big { gap: 10px; margin-top: 6px; }
.row.big .btn { font-size: 1.15rem; padding: 12px 22px; }

/* ---------- top bar: the window frame with its title strip */
.top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--chrome); color: var(--ink-chrome);
  border: 2px solid var(--chrome-dk); box-shadow: var(--bevel-out); padding: 0 8px 8px; }
.brand { flex: 1 0 100%; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 2px -6px 0; padding: 3px 8px;
  background: linear-gradient(90deg, var(--title), var(--title-2)); color: #fff; }
.logo { font-family: var(--f-pixel); font-weight: 700; font-size: 1.35rem; color: #fff; letter-spacing: .04em; text-shadow: 2px 2px 0 #0b1336; }
.turn { font-family: var(--f-pixel); font-size: 1.05rem; color: #dfe6ff; }
.peace { font-family: var(--f-pixel); font-size: .9rem; color: #b8ffc4; }
.resbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; box-shadow: var(--bevel-in); background: #8c887c; }
.res { display: flex; align-items: center; gap: 5px; background: var(--lcd); color: #c8ffd0; padding: 2px 8px; min-height: 30px;
  font-family: var(--f-pixel); font-variant-numeric: tabular-nums; }
.res b { font-size: 1.1rem; font-weight: 600; color: #e8ffe6; }
.res small { color: var(--mint); }
.ri { font-size: 1.1rem; display: inline-flex; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
.focus { display: flex; align-items: center; gap: 6px; font-family: var(--f-pixel); font-size: .9rem; color: var(--ink-chrome); }
.focus select { font: inherit; color: var(--ink-chrome); background: #f4f1e8; border: 2px solid var(--chrome-dk); box-shadow: var(--bevel-in); border-radius: 0; padding: 4px 6px; }
.score { display: flex; gap: 4px; flex-wrap: wrap; font-family: var(--f-pixel); font-size: .88rem; }
